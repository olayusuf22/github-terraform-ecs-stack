name: Deploy to AWS ECS

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: my-app
  
jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    environment: 
      name: ${{ github.event.inputs.environment || 'dev' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.event.inputs.environment }}" != "" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          ENVIRONMENT: ${{ steps.set-env.outputs.environment }}
        run: |
          # Build Docker image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY-$ENVIRONMENT:$IMAGE_TAG ./app
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY-$ENVIRONMENT:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY-$ENVIRONMENT:latest
          
          # Push to ECR
          docker push $ECR_REGISTRY/$ECR_REPOSITORY-$ENVIRONMENT:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY-$ENVIRONMENT:latest
          
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY-$ENVIRONMENT:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check
        continue-on-error: true

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_container_image: ${{ steps.build-image.outputs.image }}
          ENVIRONMENT: ${{ steps.set-env.outputs.environment }}
        run: |
          terraform plan \
            -var-file="environments/$ENVIRONMENT.tfvars" \
            -var="container_image=$TF_VAR_container_image" \
            -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        working-directory: ./terraform
        env:
          TF_VAR_container_image: ${{ steps.build-image.outputs.image }}
          ENVIRONMENT: ${{ steps.set-env.outputs.environment }}
        run: |
          terraform apply -auto-approve tfplan

      - name: Get Load Balancer URL
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        working-directory: ./terraform
        run: |
          echo "Application URL: http://$(terraform output -raw alb_dns_name)"